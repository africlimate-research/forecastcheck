# Rwanda (Meteo Rwanda). Select it on a machine with:  echo rwanda > .deployment
#
# The country is the only required key: it sets the map, the provinces and districts,
# the seasons and the data folder (data/rwanda/). Study parameters (rain thresholds,
# altitude bands, seasons) are in config/verification.toml under [Rwanda.*].

country = "Rwanda"

# Where this country's public data lives, read only by scripts/fetch_country.sh.
data_source = "gs://aim4scale_training_2026/demo5/RWA-local-engine"
