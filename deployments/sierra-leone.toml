# Sierra Leone. Select it on a machine with:  echo sierra-leone > .deployment
#
# The country is the only required key: it sets the map, the provinces and districts,
# the seasons and the data folder (data/sierra_leone/). Study parameters (thresholds,
# altitude bands, seasons) are in config/verification.toml under ["Sierra Leone".*].

country = "Sierra Leone"

# Where this country's public data lives, read only by scripts/fetch_country.sh.
data_source = "gs://aim4scale_training_2026/demo5/SLE-local-engine"
