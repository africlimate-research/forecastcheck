# The test suite on every pull request and every push to main.
#
# CI has no data/ tree: tests that need a country's data skip, and the rest exercise
# the code on synthetic inputs. Python 3.11 is the version environment.yml installs,
# so CI tests what users actually run.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q -W ignore::DeprecationWarning
        env:
          # Numba writes its JIT cache next to the code unless told otherwise.
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba
