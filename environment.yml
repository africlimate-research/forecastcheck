# Conda environment for ForecastCheck. Works with Miniforge on macOS, Linux and the
# DGX Spark (aarch64). Python comes from conda-forge; the pinned libraries come from
# requirements.txt, so there is one list of versions to keep up to date, not two.
#
#   conda env create -f environment.yml
#   conda activate forecastcheck
name: forecastcheck
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Cartopy from conda-forge, not pip: PyPI has no Linux arm64 wheel for it (the DGX
  # Spark), so pip would compile it, and that fails without a C++ compiler. Same version
  # as requirements.txt, which then finds it installed.
  - cartopy=0.25.0
  # gcloud, which scripts/fetch_country.sh uses to read the data bucket.
  - google-cloud-sdk
  - pip:
      - -r requirements.txt
