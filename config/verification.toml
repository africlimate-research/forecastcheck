# ForecastCheck — study parameters per country, editable without touching Python.
#
# One block of sections per country, keyed by its display name: [Senegal.*],
# ["Sierra Leone".*] (quoted when the name has a space).
#
# Every section is optional: remove one and the code default applies. A section
# REPLACES the default rather than merging with it, so list every value you want.
# A malformed entry stops the run with a message naming the key.
#
# These are stored axes, not display filters. After a change, re-run:
#   thresholds      calibration.run AND verification.run
#   altitude_bands  verification.run
#   seasons         verification.run (--season, one run per window)
# Old result files are kept, but stop being selected.


# Exceedance thresholds for the ROC / reliability / cost-loss curves.
#   <variable> = [ascending values]   temperature in degC
#   An empty list [] switches the threshold curves off for that variable.
#
# Sahelian heat: 40 degC falls on ~20% of CHIRTS cell-days here, so the ladder runs
# to 45. Check a new rung holds enough events against every truth product (ERA5
# clips extremes ~1.3 degC below CHIRTS); a rare rung's AUC flatters — read
# reliability and cost-loss for it.
[Senegal.thresholds]
temperature_max = [37, 38, 39, 40, 41, 42, 43, 44, 45]
temperature_min = []    # warm nights track monsoon cloud, not heat


# Elevation strata, in metres, half-open [low, high). Use [low, "inf"] for the top band.
# "all" (every land cell) is added automatically — do not list it.
# Senegal is flat (median 48 m, max 391 m), so the bands are tens of metres.
[Senegal.altitude_bands]
"0-25"   = [0, 25]          # coast, delta, Niayes
"25-50"  = [25, 50]         # western plains
"50-100" = [50, 100]        # groundnut basin
">100"   = [100, "inf"]     # eastern rise


# Seasons the curves are pooled over. "yearly" is always offered; do not define it.
#   The slug ([Senegal.seasons.<slug>]) becomes a path segment: lowercase letters,
#   digits and underscores, and it must not match a region or department name.
#   A cross-year window is written in window order, e.g. [11, 12, 1, 2]; all its
#   months belong to the SAME verification year.
[Senegal.seasons.ndjf]
months = [11, 12, 1, 2]
label  = "NDJF (Nov–Feb)"        # cool dry season (harmattan)
[Senegal.seasons.mamj]
months = [3, 4, 5, 6]
label  = "MAMJ (Mar–Jun)"        # hot dry season — the heat peak
[Senegal.seasons.jaso]
months = [7, 8, 9, 10]
label  = "JASO (Jul–Oct)"        # rainy season (hivernage)


# ════════════════════════════════════════════════════════════════════ Sierra Leone
["Sierra Leone".thresholds]
temperature_max = [37, 38, 39, 40]
temperature_min = []    # warm nights track monsoon cloud, not heat


# Elevation strata, in metres, half-open [low, high). Use [low, "inf"] for the top band.
# "all" (every land cell) is added automatically — do not list it.
# Sierra Leone is low (median ~330 m, max ~1450 m), so the bands are hundreds of metres.
["Sierra Leone".altitude_bands]
"0-100"   = [0, 100]        # coastal plain
"100-300" = [100, 300]      # interior lowland
"300-600" = [300, 600]      # plateau
">600"    = [600, "inf"]    # Loma / Tingi hills


# Seasons the curves are pooled over. "yearly" is always offered; do not define it.
# Checked against CHIRTS: fmam holds the heat season, jjas the monsoon.
["Sierra Leone".seasons.ondj]
months = [10, 11, 12, 1]
label  = "ONDJ (Oct–Jan)"        # end of the rains, early dry season
["Sierra Leone".seasons.fmam]
months = [2, 3, 4, 5]
label  = "FMAM (Feb–May)"        # late dry season — the heat peak
["Sierra Leone".seasons.jjas]
months = [6, 7, 8, 9]
label  = "JJAS (Jun–Sep)"        # monsoon


# ════════════════════════════════════════════════════════════════════════════ Kenya
# Rainfall, in mm/day, against CHIRPS. One ladder serves ROC, reliability and cost-loss.
[Kenya.thresholds]
precipitation = [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]


# Elevation strata, in metres, half-open [low, high). Use [low, "inf"] for the top band.
# "all" (every land cell) is added automatically — do not list it.
[Kenya.altitude_bands]
"0-1000"    = [0, 1000]
"1000-2000" = [1000, 2000]
"2000-3000" = [2000, 3000]
">3000"     = [3000, "inf"]      # Mt Kenya and the Aberdares


# Seasons the curves are pooled over. "yearly" is always offered; do not define it.
# Kenya's rainfall is bimodal (peaks in April and November), so `fmam` pools the
# driest month (February) with the wettest (April). A MAM / JJAS / OND / JF split
# would separate the rains better — revisit with KMD.
[Kenya.seasons.ondj]
months = [10, 11, 12, 1]
label  = "ONDJ (Oct–Jan)"        # short rains
[Kenya.seasons.fmam]
months = [2, 3, 4, 5]
label  = "FMAM (Feb–May)"        # long rains
[Kenya.seasons.jjas]
months = [6, 7, 8, 9]
label  = "JJAS (Jun–Sep)"        # cool dry season


# ═══════════════════════════════════════════════════════════════════════════ Rwanda
# Rainfall, in mm/day, against CHIRPS: the same ladder as Kenya, so the two compare.
# Rwanda is small (~830 land cells at 0.05°): read the event count before trusting a
# high rung.
[Rwanda.thresholds]
precipitation = [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]


# Elevation strata, in metres, half-open [low, high). Use [low, "inf"] for the top band.
# "all" (every land cell) is added automatically — do not list it.
# Cut so each band holds a usable share of the land cells (16 / 46 / 20 / 17 %).
[Rwanda.altitude_bands]
"0-1400"    = [0, 1400]          # eastern lowlands, Akagera, Bugarama
"1400-1700" = [1400, 1700]       # central plateau
"1700-2000" = [1700, 2000]       # northern and western hills
">2000"     = [2000, "inf"]      # Congo-Nile ridge, Nyungwe, the volcanoes


# Seasons the curves are pooled over. "yearly" is always offered; do not define it.
# Rwanda's four seasons; each slug must not match a province or district name.
[Rwanda.seasons.djf]
months = [12, 1, 2]
label  = "DJF (Dec–Feb)"         # short dry season (Urugaryi)
[Rwanda.seasons.mam]
months = [3, 4, 5]
label  = "MAM (Mar–May)"         # long rains (Itumba)
[Rwanda.seasons.jja]
months = [6, 7, 8]
label  = "JJA (Jun–Aug)"         # long dry season (Icyi)
[Rwanda.seasons.son]
months = [9, 10, 11]
label  = "SON (Sep–Nov)"         # short rains (Umuhindo)
